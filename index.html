    <style>
      /* Prevent scrolling while dragging on mobile */

        0% { transform: scale(1); filter: brightness(1.5); box-shadow: 0 0 10px white; }

      }
      .animate-flash-shrink {
        animation: flash-shrink 0.3s ease-in forwards;
      }
    </style>
